name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: gobzzz-g
          filename: github-metrics.svg

          # Full-width responsive layout
          config_display: columns

          # Section order
          config_order: base.header, base.activity+community, languages, isocalendar, repositories, base.repositories, topics

          # Base sections
          base: header, activity, community, repositories

          # Your pinned repositories (explicitly listed for reliability)
          plugin_repositories: yes
          plugin_repositories_featured: gobzzz-g/LoanKit-Ai, gobzzz-g/Audionest, gobzzz-g/Streamlit-Living_Simulator_for_Mars, gobzzz-g/Web-Application-PlayHub, gobzzz-g/Gobinath--Portfolio, gobzzz-g/Policy-Secure
          plugin_repositories_order: featured

          # Contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Programming languages
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8

          # Starred topics
          plugin_topics: yes
          plugin_topics_limit: 10

          # Expand repository cards to use the available width
          extras_css: |
            .repository .name {
              width: 100% !important;
            }
            .repository .description {
              width: calc(100% - 38px) !important;
              max-width: none !important;
            }

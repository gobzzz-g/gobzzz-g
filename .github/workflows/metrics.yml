name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/metrics.yml"

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: gobzzz-g
          filename: github-metrics.svg

          # Full-width two-column layout
          config_display: columns

          # Keep repositories out of the dashboard
          config_order: base.header, base.activity+community, languages, lines, isocalendar, repositories, topics

          # Base sections
          base: header, activity, community

          # Featured repositories — use the six repositories pinned on your GitHub profile
          plugin_repositories: yes
          plugin_repositories_pinned: 6
          plugin_repositories_order: pinned

          # Contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Programming languages
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8

          # Code activity — fills the open space with repository change history
          plugin_lines: yes
          plugin_lines_sections: repositories,history
          plugin_lines_repositories_limit: 6
          plugin_lines_history_limit: 1
          plugin_lines_delay: 30

          # Starred topics
          plugin_topics: yes
          plugin_topics_limit: 10

          # Keep the isometric calendar fully visible inside the columns layout.
          # The plugin writes an inline negative margin, so CSS alone cannot reliably override it.
          extras_css: |
            svg.columns section > svg {
              max-width: 100% !important;
              height: auto !important;
            }

          extras_js: |
            document.querySelectorAll('svg[style*="margin-top: -130px"]').forEach((calendar) => {
              calendar.style.marginTop = '0px';
              calendar.style.maxWidth = '100%';
              calendar.style.width = '100%';
              calendar.style.height = 'auto';
            });

          # Add enough vertical room so the calendar cannot be cropped.
          config_padding: 0, 80

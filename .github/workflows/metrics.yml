name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}

      - name: Fix calendar positioning
        run: |
          sed -i 's/style="margin-top: -130px;"/style="margin-top: 0;"/' github-metrics.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg
          git diff --cached --quiet || git commit -m "fix: restore visible contribution calendar"
          git push

          user: gobzzz-g
          filename: github-metrics.svg

          # Full-width responsive layout
          config_display: columns

          # Section order — repositories removed
          config_order: base.header, base.activity+community, languages, isocalendar, topics

          # Base sections
          base: header, activity, community

          # Contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Programming languages
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8

          # Starred topics
          plugin_topics: yes
          plugin_topics_limit: 10

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="315" viewBox="0 0 760 427" role="img" aria-label="Gobinath animated Mac terminal">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f8f8"/>
      <stop offset="0.45" stop-color="#d9d9d9"/>
      <stop offset="1" stop-color="#a9a9a9"/>
    </linearGradient>
    <linearGradient id="innerChrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bdbdbd"/>
    </linearGradient>

    <clipPath id="window">
      <rect x="1" y="1" width="758" height="425" rx="12"/>
    </clipPath>

    <clipPath id="type1"><rect x="28" y="63" width="0" height="24"><animate attributeName="width" values="0;650;650;0" keyTimes="0;.18;.82;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="type2"><rect x="28" y="121" width="0" height="24"><animate attributeName="width" values="0;650;650;0" keyTimes="0;.18;.82;1" dur="12s" begin="1.9s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="type3"><rect x="28" y="179" width="0" height="24"><animate attributeName="width" values="0;650;650;0" keyTimes="0;.18;.82;1" dur="12s" begin="3.8s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="type4"><rect x="28" y="237" width="0" height="24"><animate attributeName="width" values="0;650;650;0" keyTimes="0;.18;.82;1" dur="12s" begin="5.7s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="type5"><rect x="28" y="295" width="0" height="24"><animate attributeName="width" values="0;650;650;0" keyTimes="0;.18;.82;1" dur="12s" begin="7.6s" repeatCount="indefinite"/></rect></clipPath>

    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
      .cmd{font-size:17px;fill:#f4f4f4}
      .out{font-size:16px;fill:#c4cbd2}
      .prompt{fill:#4fe38a}
      .accent{fill:#79c7ff}
      .answer{opacity:0;animation:appear 12s linear infinite}
      .a1{animation-delay:1.45s}.a2{animation-delay:3.35s}.a3{animation-delay:5.25s}
      .a4{animation-delay:7.15s}.a5{animation-delay:9.05s}
      .cursor{animation:blink .75s steps(1,end) infinite}
      @keyframes appear{0%,10%{opacity:0}14%,82%{opacity:1}88%,100%{opacity:0}}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      @media (prefers-reduced-motion:reduce){
        .answer{animation:none;opacity:1}
        .cursor{animation:none;opacity:1}
      }
    </style>
  </defs>

  <!-- Silver Mac-style outer frame -->
  <rect x="0.75" y="0.75" width="758.5" height="425.5" rx="13" fill="url(#chrome)" stroke="#8c8c8c" stroke-width="1.5"/>
  <rect x="4" y="4" width="752" height="419" rx="10" fill="#111111" stroke="url(#innerChrome)" stroke-width="1"/>

  <g clip-path="url(#window)">
    <!-- Mac silver title bar -->
    <rect x="4" y="4" width="752" height="48" fill="url(#chrome)"/>
    <rect x="4" y="51" width="752" height="1" fill="#8e8e8e"/>

    <!-- Traffic lights -->
    <circle cx="27" cy="28" r="7.5" fill="#ff5f57" stroke="#d84b45" stroke-width="1"/>
    <circle cx="51" cy="28" r="7.5" fill="#ffbd2e" stroke="#d69b19" stroke-width="1"/>
    <circle cx="75" cy="28" r="7.5" fill="#28c840" stroke="#1d9d31" stroke-width="1"/>

    <text x="380" y="33" text-anchor="middle" class="mono" font-size="14" fill="#4b4b4b">gobinath — zsh</text>

    <!-- Terminal body -->
    <rect x="4" y="52" width="752" height="371" fill="#0b0d0f"/>

    <g class="mono">
      <!-- 1 -->
      <g clip-path="url(#type1)">
        <text x="28" y="81" class="cmd"><tspan class="prompt">gobinath@dev</tspan><tspan fill="#929aa3"> ~ % </tspan><tspan>whoami</tspan></text>
      </g>
      <text x="28" y="107" class="out answer a1">Gobinath G — Full Stack Developer</text>

      <!-- 2 -->
      <g clip-path="url(#type2)">
        <text x="28" y="139" class="cmd"><tspan class="prompt">gobinath@dev</tspan><tspan fill="#929aa3"> ~ % </tspan><tspan>cat skills.txt</tspan></text>
      </g>
      <text x="28" y="165" class="out answer a2"><tspan class="accent">React</tspan> · <tspan class="accent">Python</tspan> · <tspan class="accent">Node.js</tspan> · <tspan class="accent">AI Agents</tspan></text>

      <!-- 3 -->
      <g clip-path="url(#type3)">
        <text x="28" y="197" class="cmd"><tspan class="prompt">gobinath@dev</tspan><tspan fill="#929aa3"> ~ % </tspan><tspan>cat focus.txt</tspan></text>
      </g>
      <text x="28" y="223" class="out answer a3">Building AI-powered apps &amp; agentic workflows</text>

      <!-- 4 -->
      <g clip-path="url(#type4)">
        <text x="28" y="255" class="cmd"><tspan class="prompt">gobinath@dev</tspan><tspan fill="#929aa3"> ~ % </tspan><tspan>git status</tspan></text>
      </g>
      <text x="28" y="281" class="out answer a4"><tspan class="prompt">●</tspan> ready to build something useful</text>

      <!-- 5 -->
      <g clip-path="url(#type5)">
        <text x="28" y="313" class="cmd"><tspan class="prompt">gobinath@dev</tspan><tspan fill="#929aa3"> ~ % </tspan><tspan>npm run create</tspan></text>
      </g>
      <text x="28" y="339" class="out answer a5"><tspan class="prompt">✓</tspan> turning ideas into working prototypes...</text>

      <text x="28" y="375" class="out" fill="#7f8790">~/gobzzz-g</text>
      <text x="28" y="401" class="out"><tspan class="prompt">➜</tspan> <tspan>ready for the next build.</tspan><tspan class="cursor" fill="#4fe38a">▋</tspan></text>
    </g>
  </g>
</svg>